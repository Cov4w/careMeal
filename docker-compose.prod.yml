version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: caremeal-postgres
    restart: always
    environment:
      POSTGRES_DB: caremeal
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d caremeal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: cov4/caremeal-backend:latest
    container_name: caremeal-backend
    ports:
      - "8000:8000"
    volumes:
      - ./static:/app/static
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/caremeal
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    image: cov4/caremeal-frontend:latest
    container_name: caremeal-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
